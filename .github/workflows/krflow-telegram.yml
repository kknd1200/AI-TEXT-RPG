# 서버도 내 PC도 없이, GitHub 가 대신 실행해서 텔레그램으로 수급 상위 종목을 보낸다.
# 저장소 Settings > Secrets and variables > Actions 에 아래 네 개를 등록하면 동작한다:
#   KIWOOM_APP_KEY, KIWOOM_APP_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHAT_IDS

name: 수급 알림 (텔레그램)

on:
  workflow_dispatch: # Actions 탭에서 수동 실행 (설정 확인용)
    inputs:
      title:
        description: 제목 앞에 붙일 문구
        required: false
        default: "수동 실행 · "
  schedule:
    # cron 은 UTC 기준. KST = UTC+9 이므로 00:00~06:30 UTC = 09:00~15:30 KST.
    # 평일 장중 30분마다.
    - cron: "0,30 0-6 * * 1-5"

# 동시에 여러 개가 겹쳐 도는 것을 막는다.
concurrency:
  group: krflow-telegram
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치
        run: pip install -e .

      - name: 수급 상위 전송
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        run: |
          krflow push \
            --provider kiwoom \
            --market all \
            --investor both \
            --side buy \
            --metric value \
            --top 10 \
            --title "${{ inputs.title }}"
